<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>哈基米AI旅途 - 智能行程规划</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for Exporting Images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <!-- Tesseract.js for Image OCR (图片文字识别) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .pulse-dot { animation: pulse-dot 1.2s ease-in-out infinite; }
        .toast-show { transform: translateY(0) !important; opacity: 1 !important; pointer-events: auto !important; }
        
        /* 移动端缩放到桌面端布局，解决显示不全问题 */
        .mobile-zoom-fit {
            transform-origin: top left;
            transition: transform 0.3s ease;
        }

        .main-content { height: calc(100vh - 60px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden relative">

    <!-- Top Header Navigation -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-20 flex-shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-purple-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md shadow-purple-100">
                <i class="fa-solid fa-cat text-xl"></i> <!-- 更换为猫咪图标 -->
            </div>
            <div>
                <h1 class="font-bold text-slate-800 text-lg leading-tight">哈基米AI旅途</h1>
                <p class="text-xs text-slate-500">AI语音/图片识别 • 精确规划 • 一键导航</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- 移动端缩放切换按钮 -->
            <button onclick="toggleMobileZoom()" id="zoomBtn" class="hidden sm:flex items-center space-x-1 px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-sm font-medium rounded-lg transition">
                <i class="fa-solid fa-expand"></i>
                <span>全局视图</span>
            </button>
            <button onclick="exportItinerary()" id="exportBtn" class="hidden sm:flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">
                <i class="fa-solid fa-download"></i>
                <span>导出图片</span>
            </button>
            <button onclick="toggleSettingsModal()" class="p-2 hover:bg-slate-100 text-slate-600 rounded-lg transition" title="设置 API Key">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container (缩放容器) -->
    <div id="appContainer" class="flex-1 flex flex-col md:flex-row overflow-hidden relative main-content bg-white mobile-zoom-fit">
        <div class="w-full max-w-4xl mx-auto bg-white flex flex-col h-full shadow-lg md:shadow-none p-4 md:p-8 overflow-hidden">

            <!-- AI Input Box Area -->
            <div class="border-b border-slate-100 pb-4 flex-shrink-0">
                <label for="aiPrompt" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">描述您的旅游计划</label>
                <div class="relative">
                    <textarea id="aiPrompt" rows="3" class="w-full p-3 pr-12 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none resize-none shadow-sm transition" placeholder="例如：帮我规划成都 3 天经典美食与景点游，必去宽窄巷子、大熊猫基地和锦里..."></textarea>
                    <button onclick="generateItinerary()" id="generateBtn" class="absolute bottom-3 right-3 bg-purple-600 hover:bg-purple-700 text-white p-2 rounded-lg transition shadow-md flex items-center justify-center">
                        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                    </button>
                </div>

                <!-- 新增：上传图片识别与快捷提示 -->
                <div class="flex items-center gap-1.5 mt-2.5 overflow-x-auto pb-1 text-xs">
                    <button onclick="document.getElementById('imageUpload').click()" class="flex-shrink-0 flex items-center gap-1 px-3 py-1.5 bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200 hover:border-purple-300 rounded-full text-blue-700 transition shadow-sm cursor-pointer">
                        <i class="fa-solid fa-image text-blue-500"></i> 📷 上传图片识别
                    </button>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(this)">
                    
                    <div class="w-px h-4 bg-slate-300 mx-1 flex-shrink-0"></div>

                    <span class="text-slate-400 whitespace-nowrap flex-shrink-0">快捷灵感:</span>
                    <button onclick="fillPrompt('杭州 2 天深度游，西湖、灵隐寺，体验江南风情')" class="px-2 py-1 bg-white border border-slate-200 hover:border-purple-300 rounded-md text-slate-600 whitespace-nowrap transition flex-shrink-0">杭州2日游</button>
                    <button onclick="fillPrompt('西安 3 天历史文化之旅，兵马俑、大唐不夜城、城墙')" class="px-2 py-1 bg-white border border-slate-200 hover:border-purple-300 rounded-md text-slate-600 whitespace-nowrap transition flex-shrink-0">西安3日游</button>
                    <button onclick="fillPrompt('三亚 4 天海岛度假行程，亚龙湾、蜈支洲岛')" class="px-2 py-1 bg-white border border-slate-200 hover:border-purple-300 rounded-md text-slate-600 whitespace-nowrap transition flex-shrink-0">三亚4日游</button>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loadingState" class="hidden p-8 text-center flex-1 flex flex-col items-center justify-center">
                <div class="relative w-12 h-12 mb-4">
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-purple-200 rounded-full animate-ping"></div>
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-purple-600 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <h3 class="font-semibold text-slate-700 text-base">哈基米AI正在精准规划行程...</h3>
                <p class="text-xs text-slate-400 mt-1">正在解析文字、图片信息及具体地址...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="p-8 text-center flex-1 flex flex-col items-center justify-center text-slate-400">
                <i class="fa-solid fa-cat text-4xl mb-3 text-purple-200"></i>
                <p class="text-sm">在上方输入或拍照上传行程要求<br>AI 将为您自动规划时间轴与导航路线</p>
            </div>

            <!-- Timeline Render Container -->
            <div id="itineraryContainer" class="hidden flex-1 overflow-y-auto py-4 space-y-6">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100 flex-shrink-0">
                    <div>
                        <h2 id="planTitle" class="font-bold text-slate-800 text-lg">行程路线规划</h2>
                        <span id="planSummary" class="text-xs text-slate-500">共 0 天行程</span>
                    </div>
                </div>

                <div id="timelineContent" class="space-y-6 relative before:absolute before:inset-0 before:left-3.5 before:w-0.5 before:bg-slate-200 pb-10">
                </div>
            </div>

        </div>
    </div>

    <!-- API Key Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i class="fa-solid fa-sliders text-purple-600"></i> 哈基米AI服务配置</h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-500 mb-4">配置您的 API Key 以唤醒智能 AI 解析能力。</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">选择 API 服务商</label>
                    <select id="apiProvider" onchange="onProviderChange()" class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                        <option value="deepseek">DeepSeek API (国内首选)</option>
                        <option value="gemini">Google Gemini API</option>
                        <option value="openai">OpenAI / 兼容格式 API</option>
                    </select>
                </div>
                <div id="customEndpointGroup" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">自定义 API Endpoint</label>
                    <input type="text" id="apiEndpoint" class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none" placeholder="https://api.openai.com/v1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">API Key</label>
                    <input type="password" id="apiKeyInput" class="w-full p-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none" placeholder="输入您的 API 密钥">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="toggleSettingsModal()" class="px-4 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-lg text-sm font-medium transition">取消</button>
                <button onclick="saveSettings()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-medium transition">保存配置</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm z-50 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-info text-purple-400"></i>
        <span id="toastMsg">提示内容</span>
    </div>

    <!-- Application Core Logic -->
    <script>
        // ============================================================
        //  1. 状态管理
        // ============================================================
        let currentItinerary = null;
        let isGenerating = false;
        let isMobileZoomed = false;

        const CONFIG = {
            provider: localStorage.getItem('ai_provider') || 'deepseek',
            apiKey: localStorage.getItem('ai_api_key') || '',
            endpoint: localStorage.getItem('ai_endpoint') || 'https://api.openai.com/v1'
        };

        // ============================================================
        //  2. 初始化与缩放适配
        // ============================================================
        window.onload = function() {
            loadSavedConfig();
            checkMobileZoom();
            window.addEventListener('resize', checkMobileZoom);
        };

        function loadSavedConfig() {
            document.getElementById('apiProvider').value = CONFIG.provider;
            document.getElementById('apiKeyInput').value = CONFIG.apiKey;
            document.getElementById('apiEndpoint').value = CONFIG.endpoint;
            onProviderChange();
        }

        // --- 移动端缩放功能核心 ---
        function checkMobileZoom() {
            const zoomBtn = document.getElementById('zoomBtn');
            if (window.innerWidth < 768) { // 判断是否为手机
                zoomBtn.classList.remove('hidden');
            } else {
                zoomBtn.classList.add('hidden');
                // 如果是电脑大屏，重置缩放
                document.getElementById('appContainer').style.transform = 'scale(1)';
                document.getElementById('appContainer').style.width = '100%';
                isMobileZoomed = false;
            }
        }

        function toggleMobileZoom() {
            const container = document.getElementById('appContainer');
            const zoomBtn = document.getElementById('zoomBtn');
            
            if (!isMobileZoomed) {
                // 开启全局缩放（解决手机显示不全）
                const windowWidth = window.innerWidth;
                // 假设桌面端设计宽度约 1024px，按照手机宽度进行等比缩放
                const scale = Math.min(1, windowWidth / 1024); 
                container.style.transform = `scale(${scale})`;
                container.style.transformOrigin = 'top left';
                container.style.width = `${100 / scale}%`; // 防止缩放后出现大片留白
                
                zoomBtn.innerHTML = `<i class="fa-solid fa-compress"></i> <span>手机视图</span>`;
                isMobileZoomed = true;
            } else {
                // 关闭缩放，恢复正常移动端视图
                container.style.transform = 'scale(1)';
                container.style.width = '100%';
                zoomBtn.innerHTML = `<i class="fa-solid fa-expand"></i> <span>全局视图</span>`;
                isMobileZoomed = false;
            }
            showToast("视图切换成功", "info");
        }

        // ============================================================
        //  3. 设置面板
        // ============================================================
        function onProviderChange() {
            const provider = document.getElementById('apiProvider').value;
            const endpointGroup = document.getElementById('customEndpointGroup');
            if (provider === 'openai') endpointGroup.classList.remove('hidden');
            else endpointGroup.classList.add('hidden');
        }

        function toggleSettingsModal() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveSettings() {
            CONFIG.provider = document.getElementById('apiProvider').value;
            CONFIG.apiKey = document.getElementById('apiKeyInput').value.trim();
            CONFIG.endpoint = document.getElementById('apiEndpoint').value.trim();

            localStorage.setItem('ai_provider', CONFIG.provider);
            localStorage.setItem('ai_api_key', CONFIG.apiKey);
            localStorage.setItem('ai_endpoint', CONFIG.endpoint);

            showToast("配置保存成功", "success");
            toggleSettingsModal();
        }

        // ============================================================
        //  4. 交互辅助
        // ============================================================
        function fillPrompt(text) {
            document.getElementById('aiPrompt').value = text;
        }

        // ============================================================
        //  5. 核心功能：图片识别 OCR
        // ============================================================
        async function handleImageUpload(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                showToast("正在识别图片中的文字，请稍候...", "info");
                
                try {
                    const result = await Tesseract.recognize(file, 'chi_sim+eng', {
                        logger: m => {
                            if(m.status === 'recognizing text') {
                                // 可在此处增加进度条，这里简单处理
                            }
                        }
                    });
                    
                    const text = result.data.text.trim();
                    if (text) {
                        document.getElementById('aiPrompt').value = text;
                        showToast("图片文字识别成功！请确认后点击生成。", "success");
                    } else {
                        showToast("未能识别出有效文字，请重试或手动输入", "warning");
                    }
                } catch (error) {
                    console.error(error);
                    showToast("图片识别失败，请手动输入文字", "error");
                } finally {
                    input.value = ''; // 清空文件选择，允许重复上传同一张图
                }
            }
        }

        // ============================================================
        //  6. 核心：生成行程
        // ============================================================
        async function generateItinerary() {
            if (isGenerating) return;
            const prompt = document.getElementById('aiPrompt').value.trim();
            if (!prompt) {
                showToast("请输入行程需求或上传图片识别", "warning");
                return;
            }

            isGenerating = true;
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('itineraryContainer').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');

            try {
                const systemPrompt = `你是一个精准的旅游规划助手。请根据用户的需求，生成符合格式要求的 JSON 数据。
        结构严格如下：
        {
          "title": "行程大标题",
          "summary": "简短摘要说明",
          "days": [
            {
              "day": 1,
              "theme": "当天主题",
              "spots": [
                {
                  "name": "景点/店铺全称",
                  "time": "推荐时间范围 (例: 09:00 - 11:30)",
                  "description": "简单游玩建议与特色",
                  "address": "精确到街道门牌号或地标的具体地址，越详细越好，用于生成导航"
                }
              ]
            }
          ]
        }
        只返回合法 JSON，严禁输出任何 Markdown 标记或多余文字。`;

                let itineraryData = null;

                if (CONFIG.apiKey) {
                    itineraryData = await callUserAIAPI(systemPrompt, prompt);
                } else {
                    await new Promise(r => setTimeout(r, 1200));
                    itineraryData = getDemoItineraryData();
                    showToast("当前为测试演示模式，填入 Key 后可自由定制路线", "info");
                }

                if (itineraryData) {
                    currentItinerary = itineraryData;
                    renderItineraryTimeline(itineraryData);
                    showToast("行程规划完成 ✨", "success");
                }
            } catch (error) {
                console.error("AI 规划发生错误:", error);
                showToast("生成失败: " + error.message, "error");
                document.getElementById('emptyState').classList.remove('hidden');
            } finally {
                isGenerating = false;
                document.getElementById('loadingState').classList.add('hidden');
            }
        }

        // ============================================================
        //  7. AI API 调用
        // ============================================================
        async function callUserAIAPI(systemPrompt, userPrompt) {
            let rawText = "";
            if (CONFIG.provider === 'gemini') {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.apiKey}`;
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) throw new Error(data.error?.message || `Gemini API 失败`);
                rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            } else if (CONFIG.provider === 'deepseek' || CONFIG.provider === 'openai') {
                const endpoint = CONFIG.provider === 'deepseek' ? 'https://api.deepseek.com/v1/chat/completions' : `${CONFIG.endpoint.replace(/\/+$/, '')}/chat/completions`;
                const resp = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${CONFIG.apiKey}` },
                    body: JSON.stringify({
                        model: CONFIG.provider === 'deepseek' ? 'deepseek-chat' : 'gpt-3.5-turbo',
                        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }],
                        response_format: { type: 'json_object' }
                    })
                });
                const data = await resp.json();
                if (!resp.ok || data.error) {
                    if (resp.status === 401) throw new Error("API Key 错误");
                    throw new Error(data.error?.message || `请求失败`);
                }
                rawText = data.choices?.[0]?.message?.content;
            }
            if (!rawText) throw new Error("AI 服务未返回有效文本");
            const cleanJson = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();
            try {
                return JSON.parse(cleanJson);
            } catch (e) {
                console.error("返回文本:", rawText);
                throw new Error("AI 返回结果解析失败，请重试");
            }
        }

        // ============================================================
        //  8. 渲染行程时间线
        // ============================================================
        function renderItineraryTimeline(data) {
            document.getElementById('planTitle').innerText = data.title || "行程路线规划";
            document.getElementById('planSummary').innerText = `${data.days.length} 天深度行程规划`;

            const timeline = document.getElementById('timelineContent');
            timeline.innerHTML = '';

            let spotGlobalIndex = 1;

            data.days.forEach((dayData) => {
                const dayBlock = document.createElement('div');
                dayBlock.className = "relative pl-8 space-y-3";

                dayBlock.innerHTML = `
                    <div class="absolute -left-1.5 top-0.5 w-6 h-6 rounded-full bg-purple-600 text-white flex items-center justify-center text-xs font-bold ring-4 ring-white shadow">
                        ${dayData.day}
                    </div>
                    <div class="mb-2">
                        <h3 class="font-bold text-slate-800 text-sm">第 ${dayData.day} 天：${dayData.theme || ''}</h3>
                    </div>
                `;

                const spotsContainer = document.createElement('div');
                spotsContainer.className = "space-y-4";

                dayData.spots.forEach((spot) => {
                    const spotCard = document.createElement('div');
                    spotCard.className = "bg-white border border-slate-200 rounded-xl p-4 hover:border-purple-300 hover:shadow-lg transition cursor-default";

                    const navUrl = `https://uri.amap.com/marker?address=${encodeURIComponent(spot.address || spot.name)}&name=${encodeURIComponent(spot.name)}`;

                    spotCard.innerHTML = `
                        <div class="flex items-start justify-between mb-2">
                            <div class="flex items-center space-x-2">
                                <span class="bg-purple-100 text-purple-700 text-xs font-bold px-2 py-0.5 rounded-full">
                                    #${spotGlobalIndex}
                                </span>
                                <h4 class="font-semibold text-slate-800 text-base">${spot.name}</h4>
                            </div>
                            <span class="text-xs text-slate-500 font-mono bg-slate-50 px-2 py-1 rounded"><i class="fa-regular fa-clock mr-1"></i>${spot.time || ''}</span>
                        </div>
                        
                        <div class="mb-3">
                            <p class="text-sm text-slate-600 leading-relaxed">${spot.description || ''}</p>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                            <div class="flex items-center text-xs text-slate-500 gap-2">
                                <i class="fa-solid fa-location-dot text-purple-500"></i>
                                <span class="truncate max-w-[140px] sm:max-w-[200px]" title="${spot.address || '请在地图上搜索该景点'}">
                                    ${spot.address || '地址信息待补充'}
                                </span>
                            </div>
                            <a href="${navUrl}" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow flex items-center gap-1 transition">
                                <i class="fa-solid fa-paper-plane"></i> 高德导航
                            </a>
                        </div>
                    `;
                    spotsContainer.appendChild(spotCard);
                    spotGlobalIndex++;
                });

                dayBlock.appendChild(spotsContainer);
                timeline.appendChild(dayBlock);
            });

            document.getElementById('itineraryContainer').classList.remove('hidden');
        }

        // ============================================================
        //  9. 导出功能
        // ============================================================
        function exportItinerary() {
            const container = document.getElementById('itineraryContainer');
            if (container.classList.contains('hidden')) {
                showToast("暂无可导出的行程", "warning");
                return;
            }
            showToast("正在导出图片...", "info");
            html2canvas(container, { backgroundColor: "#ffffff", scale: 2, scrollY: 0 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `哈基米AI旅途_行程规划_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("导出成功", "success");
            }).catch(() => showToast("导出失败", "error"));
        }

        // ============================================================
        //  10. Toast 通知
        // ============================================================
        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            toastMsg.innerText = message;
            if (type === "success") toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            else if (type === "error") toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            else if (type === "warning") toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            else toastIcon.className = "fa-solid fa-circle-info text-purple-400";
            toast.classList.add('toast-show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('toast-show'); }, 3200);
        }
